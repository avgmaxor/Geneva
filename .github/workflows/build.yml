# Builds Windows, Mac and Linux zips
# - Every push: download them from the run's "Artifacts" section on the Actions tab
# - Pushing a tag like v0.17: they're also attached to a GitHub Release
name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller pillow

      - name: Build
        run: python build.py

      - uses: actions/upload-artifact@v4
        with:
          name: Geneva-${{ matrix.os }}
          path: dist/*.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
